name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} pytest
      - run: make lint
        if: matrix.python == '3.13'

  build:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make check
      - run: mv dist/tally.alfredworkflow dist/Tally.alfredworkflow
      - uses: actions/upload-artifact@v4
        with:
          name: Tally.alfredworkflow
          path: dist/Tally.alfredworkflow

  latest:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tally.alfredworkflow
          path: dist
      - run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: true
          files: dist/Tally.alfredworkflow

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tally.alfredworkflow
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Tally.alfredworkflow
