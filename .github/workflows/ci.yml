name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --isolated --python ${{ matrix.python }} pytest

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: /usr/bin/python3 --version
      - run: uv run --isolated --python /usr/bin/python3 pytest

  build:
    runs-on: macos-latest
    needs: [lint, test, test-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make check SMOKE_PYTHON=/usr/bin/python3
      - run: mv dist/tally.alfredworkflow dist/Tally.alfredworkflow
      - uses: actions/upload-artifact@v4
        with:
          name: Tally.alfredworkflow
          path: dist/Tally.alfredworkflow

  latest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tally.alfredworkflow
          path: dist
      - run: gh release delete latest --yes --cleanup-tag || true
      - run: >
          gh release create latest dist/Tally.alfredworkflow
          --prerelease --title "latest · ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
          --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC.
          Download Tally.alfredworkflow and double-click it."

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tally.alfredworkflow
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Tally.alfredworkflow
