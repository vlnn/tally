[project]
name = "tally"
version = "0.1.0"
description = "Alfred workflow for logging time by switching tasks: type t, resume, stop, see the day"
requires-python = ">=3.9"
dependencies = ["hoard>=1.8.1"]

[tool.uv.sources]
hoard = { git = "https://github.com/vlnn/hoard", tag = "v1.8.1" }

[project.scripts]
tally = "tally.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "B"]
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tally", "conftest"]

[tool.mypy]
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
